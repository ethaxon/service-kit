name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable real symlink checkout
        run: git config --global core.symlinks true
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- just setup
      - run: mise exec -- just check
      - run: mise exec -- just test
      - run: mise exec -- just build-docs
